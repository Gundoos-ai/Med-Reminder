<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ঔষধ রিমাইন্ডার</title>
<style>
:root{--bg:#f4f8f6;--card:#fff;--tx:#17302a;--mu:#5d7770;--pr:#0f8b6d;--pt:#fff;--bd:#d6e4df;--dn:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a17;--card:#17262a;--tx:#e6f1ed;--mu:#93aca5;--pr:#2bb792;--pt:#06241c;--bd:#27403a;--dn:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Bengali",sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,24px)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:20px 0 8px}
.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0}
input.full{width:100%}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:var(--pt);font-weight:600}
button.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.d{background:transparent;color:var(--dn);padding:6px 8px}
.dose{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
.dose:first-of-type{border-top:0}
.t{font-weight:700;font-size:18px}.m{font-size:13px;color:var(--mu)}
.done{opacity:.5}.done .t{text-decoration:line-through}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.empty{color:var(--mu);text-align:center;padding:14px}
</style></head><body><main>
<h1>💊 ঔষধ রিমাইন্ডার</h1>
<p class="sub">সময় হলে ফোন লক থাকলেও অ্যালার্ম নোটিফিকেশন আসবে।</p>
<div class="row"><button class="g" id="tt">🔔 ১০ সেকেন্ড পর টেস্ট অ্যালার্ম</button></div>
<h2>আজকের ঔষধ</h2><div id="today"></div>
<h2>নতুন ঔষধ যোগ করুন</h2>
<div class="card">
<label>ঔষধের নাম</label><input class="full" id="nm" placeholder="যেমন: Napa 500mg">
<label>কত দিন খেতে হবে</label><div class="row"><input id="dy" type="number" min="1" value="7" style="width:90px"> দিন</div>
<label>শুরুর তারিখ</label><input id="sd" type="date">
<label>কখন খাবেন</label><div id="doses"></div>
<button class="g" id="ad" style="margin-top:8px">+ আরেকটি সময় যোগ করুন</button>
<button id="sv" style="width:100%;margin-top:14px">ঔষধ সংরক্ষণ করুন</button>
</div>
<h2>আমার সব ঔষধ</h2><div id="all"></div>
</main>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const M={b:'খাবারের আগে',a:'খাবারের পরে'};
let S={meds:[],taken:{}};
try{const r=localStorage.getItem('medrem');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('medrem',JSON.stringify(S))}catch(e){}resched()};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const diff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f12=t=>{const[h,m]=t.split(':').map(Number);const s=h<12?'সকাল':h<16?'দুপুর':h<18?'বিকাল':'রাত';return s+' '+((h%12)||12)+':'+p2(m)};
const active=(m,td)=>{const i=diff(m.start,td);return i>=0&&i<m.days};

/* নেটিভ অ্যালার্ম */
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function setup(){const L=LN();if(!L)return;
  try{await L.requestPermissions()}catch(e){}
  try{const e=await L.checkExactNotificationSetting();if(e.exact_alarm!=='granted')await L.changeExactNotificationSetting()}catch(e){}
  try{await L.createChannel({id:'med',name:'ঔষধের অ্যালার্ম',importance:5,vibration:true,visibility:1})}catch(e){}
}
async function resched(){const L=LN();if(!L)return;
  try{
    const pend=await L.getPending();if(pend.notifications.length)await L.cancel({notifications:pend.notifications});
    const now=Date.now(),list=[];
    S.meds.forEach(m=>{const[y,mo,d]=m.start.split('-').map(Number);
      for(let i=0;i<m.days;i++)m.doses.forEach(x=>{const[h,mi]=x.t.split(':').map(Number);
        const at=new Date(y,mo-1,d+i,h,mi,0);
        if(at>now&&at-now<14*864e5)list.push({at,title:'💊 ঔষধ খাওয়ার সময়! '+f12(x.t),body:m.name+' — '+M[x.m]+' খান'})})});
    list.sort((a,b)=>a.at-b.at);
    const n=list.slice(0,400).map((x,i)=>({id:i+1,title:x.title,body:x.body,channelId:'med',schedule:{at:x.at,allowWhileIdle:true}}));
    if(n.length)await L.schedule({notifications:n});
  }catch(e){}
}
$('#tt').onclick=async()=>{const L=LN();if(!L)return alert('এটি শুধু ইনস্টল করা অ্যাপে কাজ করবে');
  await setup();
  await L.schedule({notifications:[{id:9999,title:'💊 টেস্ট অ্যালার্ম',body:'অ্যালার্ম ঠিকভাবে কাজ করছে!',channelId:'med',schedule:{at:new Date(Date.now()+10000),allowWhileIdle:true}}]});
  alert('১০ সেকেন্ড পর নোটিফিকেশন আসবে। চাইলে ফোন লক করে দেখুন।')};

function addRow(t='08:00',m='a'){
  const d=document.createElement('div');d.className='row';d.style.marginBottom='6px';
  d.innerHTML='<input type="time" value="'+t+'"><select><option value="b">খাবারের আগে</option><option value="a">খাবারের পরে</option></select><button class="d">✕</button>';
  d.querySelector('select').value=m;
  d.querySelector('button').onclick=()=>{if($('#doses').children.length>1)d.remove()};
  $('#doses').appendChild(d);
}
function render(){
  const td=today(),list=[];
  S.meds.forEach(m=>{if(active(m,td))m.doses.forEach(d=>list.push({m,d,k:td+'|'+m.id+'|'+d.t}))});
  list.sort((a,b)=>a.d.t.localeCompare(b.d.t));
  $('#today').innerHTML=list.length?'<div class="card">'+list.map(x=>'<div class="dose '+(S.taken[x.k]?'done':'')+'"><div><div class="t">'+f12(x.d.t)+'</div><div>'+esc(x.m.name)+'</div><div class="m">'+M[x.d.m]+'</div></div><button class="'+(S.taken[x.k]?'g':'')+'" data-k="'+x.k+'">'+(S.taken[x.k]?'↩ বাতিল':'✓ খেয়েছি')+'</button></div>').join('')+'</div>':'<div class="card empty">আজকের জন্য কোনো ঔষধ নেই</div>';
  $('#today').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.taken[k]?delete S.taken[k]:S.taken[k]=1;try{localStorage.setItem('medrem',JSON.stringify(S))}catch(e){}render()});
  $('#all').innerHTML=S.meds.length?S.meds.map(m=>{const left=m.days-diff(m.start,td);const st=diff(m.start,td)<0?'শুরু '+m.start:left>0?'বাকি '+left+' দিন':'শেষ';
    return '<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(m.name)+'</b><span class="badge">'+st+'</span></div><div class="m">'+m.days+' দিন · '+m.doses.map(d=>f12(d.t)+' ('+M[d.m]+')').join(', ')+'</div><button class="d" data-id="'+m.id+'">🗑 মুছুন</button></div>'}).join(''):'<div class="card empty">এখনো কোনো ঔষধ যোগ করা হয়নি</div>';
  $('#all').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(confirm('এই ঔষধটি মুছে ফেলবেন?')){S.meds=S.meds.filter(m=>m.id!=b.dataset.id);save();render()}});
}
$('#ad').onclick=()=>addRow('13:00','a');
$('#sv').onclick=()=>{
  const name=$('#nm').value.trim(),days=parseInt($('#dy').value);
  if(!name)return alert('ঔষধের নাম লিখুন');if(!days||days<1)return alert('কত দিন খাবেন তা লিখুন');
  const doses=[...$('#doses').children].map(r=>({t:r.querySelector('input').value,m:r.querySelector('select').value})).filter(d=>d.t);
  if(!doses.length)return alert('কমপক্ষে একটি সময় দিন');
  S.meds.push({id:Date.now(),name,days,start:$('#sd').value||today(),doses});
  save();$('#nm').value='';$('#doses').innerHTML='';addRow();render();
};
$('#sd').value=today();addRow();render();setup().then(resched);
</script></body></html>
